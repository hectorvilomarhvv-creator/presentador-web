<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administrar Usuarios</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { padding: 10px 20px; background: #2D9C6B; color: white; border: none; cursor: pointer; }
        .success { color: green; } .error { color: red; }
        a { color: #2E86DE; text-decoration: none; }
    </style>
</head>
<body>
    <h2>⚙️ Panel de Administrador</h2>
    <p>Bienvenido, {{ current_user.username }}</p>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="{{ category }}">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <h3>Crear Nuevo Usuario</h3>
    <form method="POST">
        <input type="text" name="username" placeholder="Nombre de usuario" required>
        <input type="password" name="password" placeholder="Contraseña" required>
        <label><input type="checkbox" name="is_admin"> Este usuario también es administrador</label><br><br>
        <button type="submit">Crear Usuario</button>
    </form>
    <br>
    <a href="{{ url_for('inicio') }}">← Volver al generador</a> | <a href="{{ url_for('logout') }}">Cerrar Sesión</a>
</body>
</html>
