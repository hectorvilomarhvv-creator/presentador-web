<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PLANI Presentaciones</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background-color: #0f172a; /* Azul empresarial oscuro */
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #1e293b;
        }

        .logo-img {
            max-width: 180px;
            height: auto;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h2 {
            color: #ffffff;
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #D4AF37; /* Dorado */
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        input[type="text"], 
        input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #1e293b;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            outline: none;
            border-color: #D4AF37;
            background-color: #0f172a;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }

        .contact-info {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #cbd5e1;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .contact-info strong {
            color: #ffffff;
            font-size: 16px;
            display: block;
            margin-top: 5px;
        }

        /* --- AQUÍ ESTÁ EL CAMBIO DEL BOTÓN --- */
        button {
            width: 100%;
            padding: 16px;
            background-color: #ffffff; /* Fondo Blanco */
            color: #0f172a; /* Texto Azul Oscuro */
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: #f1f5f9; /* Blanco un poco más gris al pasar el mouse */
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 255, 255, 0.15);
        }
        /* ------------------------------------- */

        .error-msg {
            color: #fca5a5;
            background-color: rgba(220, 38, 38, 0.2);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid rgba(220, 38, 38, 0.5);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- LOGO -->
        <img src="{{ url_for('static', filename='logo.png') }}" alt="PLANI Logo" class="logo-img">

        <!-- TÍTULOS -->
        <h2>PLANI</h2>
        <div class="subtitle">PRESENTACIONES</div>

        <!-- Mensajes de error -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="error-msg">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <input type="text" name="username" placeholder="Usuario" required autofocus>
            </div>

            <div class="form-group">
                <input type="password" name="password" placeholder="Contraseña" required>
            </div>

            <!-- CONTACTO -->
            <div class="contact-info">
                Contacta para tu cuenta al
                <strong>TEL: 809-446-6921</strong>
            </div>

            <button type="submit">Entrar</button>
        </form>
    </div>

</body>
</html>
