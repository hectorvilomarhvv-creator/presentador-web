<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PLANI Presentaciones</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Estilo para el Logo */
        .logo-img {
            max-width: 180px; /* Tamaño del logo */
            height: auto;
            margin-bottom: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h2 {
            color: #1a1a1a;
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* AQUÍ ESTÁ EL CAMBIO: Negro fuerte y más grande */
        .subtitle {
            color: #000000; /* Negro puro */
            font-size: 20px; /* Más grande */
            font-weight: 900; /* Muy grueso (Bold) */
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        input[type="text"], 
        input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #f9f9f9;
        }

        input:focus {
            outline: none;
            border-color: #D4AF37; /* Borde dorado al escribir */
            background-color: #fff;
        }

        .contact-info {
            background-color: #fff8e1;
            border: 1px solid #ffe082;
            color: #333;
            padding: 15px;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .contact-info strong {
            color: #000;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        .error-msg {
            color: #d32f2f;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- LOGO: Asegúrate de que la imagen se llame 'logo.png' y esté en la carpeta 'static' -->
        <img src="{{ url_for('static', filename='logo.png') }}" alt="PLANI Logo" class="logo-img">

        <!-- TÍTULOS -->
        <h2>PLANI</h2>
        <div class="subtitle">PRESENTACIONES</div>

        <!-- Mensajes de error -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="error-msg">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <input type="text" name="username" placeholder="Usuario" required autofocus>
            </div>

            <div class="form-group">
                <input type="password" name="password" placeholder="Contraseña" required>
            </div>

            <!-- CONTACTO -->
            <div class="contact-info">
                Contacta para tu cuenta al<br>
                <strong>TEL: 809-446-6921</strong>
            </div>

            <button type="submit">Entrar</button>
        </form>
    </div>

</body>
</html>
